name: Build Android APK

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install workloads
      run: dotnet workload install maui

    - name: Restore
      run: dotnet restore "mobile/ZapretUI Mobile.csproj"

    - name: Publish
      run: dotnet publish "mobile/ZapretUI Mobile.csproj" -f net9.0-android -c Release -r android-arm64 -o ./artifacts

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: zapret-apk
        path: ./artifacts/*
