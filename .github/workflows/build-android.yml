name: Build Android APK

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install workloads
      shell: pwsh
      run: |
        dotnet workload install maui-android 2>&1
        dotnet workload list

    - name: Publish
      shell: pwsh
      run: |
        dotnet publish "mobile/ZapretUI Mobile.csproj" -f net9.0-android -c Release -r android-arm64 -o ./artifacts 2>&1
        if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: zapret-apk
        path: ./artifacts/*
